<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Analyzing Loader</title>
<link rel="stylesheet" href="styles.css">
</head>
<body style="margin:0; padding:0; height:100vh; width:100vw; overflow:hidden;">
<div class="container">
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>

  <div class="loader-wrap">
    <div class="logo-scanner">
      <!-- soft ambient core the stars revolve around -->
      <div class="orbit-core"></div>

      <!-- each star travels in a circular path around the center (like a moon
           orbiting a planet); the inner "upright" wrapper counter-rotates so
           the star glyph itself never spins, it just glides around smoothly -->
      <div class="orbit orbit-big">
        <div class="star-slot slot-big">
          <div class="upright upright-big">
            <div class="spark spark-big">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 3 C34.5 20 36 31 45 32 C36 33 34.5 44 32 61
                         C29.5 44 28 33 19 32 C28 31 29.5 20 32 3 Z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="orbit orbit-mid">
        <div class="star-slot slot-mid">
          <div class="upright upright-mid">
            <div class="spark spark-mid">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 3 C34.5 20 36 31 45 32 C36 33 34.5 44 32 61
                         C29.5 44 28 33 19 32 C28 31 29.5 20 32 3 Z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="orbit orbit-small">
        <div class="star-slot slot-small">
          <div class="upright upright-small">
            <div class="spark spark-small">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 3 C34.5 20 36 31 45 32 C36 33 34.5 44 32 61
                         C29.5 44 28 33 19 32 C28 31 29.5 20 32 3 Z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="status-text" id="statusText" aria-live="polite">
      <span id="statusSpan">Taking a closer look...</span>
    </div>
  </div>
</div>





<script src="script.js"></script>
</body>
</html>
