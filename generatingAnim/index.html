<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Analyzing Loader</title>
<link rel="stylesheet" href="styles.css">
</head>
<body style="margin:0; padding:0; height:100vh; width:100vw; overflow:hidden;">
<div class="container">
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>

  <div class="loader-wrap">
    <div class="logo-scanner">
      <!-- your reference animation, played as-is; glow is added purely via
           a CSS filter layered on top, so the gif's own frames/timing
           are never touched -->
      <img class="ai-gif" src="ai-generating.gif" alt="AI generating">
    </div>

    <div class="status-text" id="statusText" aria-live="polite">
      <span id="statusSpan">Taking a closer look...</span>
    </div>
  </div>
</div>





<script src="script.js"></script>
</body>
</html>
